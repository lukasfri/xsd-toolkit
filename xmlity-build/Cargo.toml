[package]
name = "xmlity-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
xsd = { path = "../xsd" }
xsd-codegen-xmlity = { path = "../xsd-codegen-xmlity" }
xsd-fragments = { path = "../xsd-fragments" }
proc-macro2 = "1.0.66"
quote = "1.0.33"
syn = { version = "2.0.29", features = ["full", "extra-traits"] }
prettyplease = "0.2.15"
thiserror.workspace = true
bon = "3.6.3"
glob = "0.3.2"
xmlity.workspace = true
xmlity-quick-xml.workspace = true
derive_more.workspace = true
url = "2.5.4"
reqwest = { version = "0.12.22", features = ["blocking"] }

[dev-dependencies]
rstest.workspace = true
pretty_assertions.workspace = true
tokio = { version = "1.46.1", features = ["full"] }
xsd-codegen-xmlity-xsd-types.workspace = true
xmlity-ns-xsd-types.workspace = true
xmlity-ns.workspace = true
xmlity-ns-xml.workspace = true
insta = { version = "1.43.1" }

[lints]
workspace = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
